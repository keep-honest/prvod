name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `npm run cli -- ...`
        2. Wait for pipeline to reach step 3
        3. Observe error in logs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Node.js Version
      options:
        - "22.x"
        - "23.x"
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Video Provider
      description: Which video provider were you using, if applicable?
      options:
        - fal.ai
        - kie.ai
        - Runware
        - N/A
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant log output here.
      render: shell
    validations:
      required: false
